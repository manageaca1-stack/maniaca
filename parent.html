<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>매니아카 - 학부모 전용</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        :root {
            --primary: #4f46e5; --bg: #f1f5f9;
            --white: #ffffff; --text: #1e293b;
            --muted: #64748b; --accent: #10b981;
        }
        body { font-family: 'Pretendard', sans-serif; margin: 0; background: var(--bg); color: var(--text); -webkit-tap-highlight-color: transparent; }
        .hidden { display: none !important; }
        
        /* 로그인 화면 */
        #login-page { height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 30px; box-sizing: border-box; background: var(--white); }
        .login-header { text-align: center; margin-bottom: 40px; }
        .login-header h1 { font-size: 2.5rem; color: var(--primary); margin: 0; font-weight: 900; }
        .login-header p { color: var(--muted); margin-top: 10px; }
        
        input { width: 100%; padding: 16px; margin-bottom: 12px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 1rem; box-sizing: border-box; }
        .btn-login { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 700; cursor: pointer; }

        /* 메인 대시보드 */
        header { background: var(--primary); color: white; padding: 25px 20px; border-radius: 0 0 30px 30px; position: sticky; top: 0; z-index: 100; }
        header h2 { margin: 0; font-size: 1.4rem; }
        header p { margin: 5px 0 0; opacity: 0.8; font-size: 0.9rem; }

        .container { padding: 20px; padding-bottom: 100px; }
        .section-title { font-size: 1.1rem; font-weight: 700; margin: 25px 0 15px; display: flex; justify-content: space-between; align-items: center; }
        
        .card { background: var(--white); padding: 20px; border-radius: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 15px; }
        
        /* 출석부 스타일 */
        .att-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f1f5f9; }
        .att-item:last-child { border: none; }
        .badge { padding: 4px 10px; border-radius: 8px; font-size: 0.8rem; font-weight: 700; }
        .badge.present { background: #ecfdf5; color: #10b981; }
        .badge.absent { background: #fef2f2; color: #ef4444; }

        /* 성적 그래프 스타일 */
        .grade-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .bar-bg { flex-grow: 1; height: 10px; background: #f1f5f9; border-radius: 10px; overflow: hidden; }
        .bar-fill { height: 100%; background: var(--primary); border-radius: 10px; transition: width 0.5s; }

        /* 하단 탭 바 */
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--white); display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #e2e8f0; box-shadow: 0 -5px 15px rgba(0,0,0,0.03); }
        .tab-item { text-align: center; color: var(--muted); font-size: 0.75rem; cursor: pointer; flex: 1; }
        .tab-item.active { color: var(--primary); font-weight: 700; }
        .tab-icon { font-size: 1.4rem; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

<div id="login-page">
    <div class="login-header">
        <h1>MANIACA</h1>
        <p>학부모 전용 안심 서비스</p>
    </div>
    <input type="text" id="parent-sid" placeholder="자녀 고유번호 (4자리)">
    <input type="password" id="parent-pw" placeholder="학부모 전용 비밀번호">
    <button class="btn-login" id="login-btn">로그인</button>
    <p style="text-align: center; font-size: 0.8rem; color: #94a3b8; margin-top: 20px;">비밀번호는 학원에 문의해주세요.</p>
</div>

<div id="main-app" class="hidden">
    <header>
        <h2 id="student-name-display">김철수 학생</h2>
        <p id="student-info-display">대치본원 | 중등부 2학년</p>
    </header>

    <div class="container">
        <div id="view-attendance" class="view-section">
            <div class="section-title">최근 출석 현황</div>
            <div class="card" id="parent-att-list">
                </div>
        </div>

        <div id="view-grades" class="view-section hidden">
            <div class="section-title">성적 분석 리포트</div>
            <div class="card">
                <h4 style="margin:0 0 15px;">학원 시험 평균: <span id="p-grade-avg" style="color:var(--primary);">0점</span></h4>
                <div id="parent-grade-chart">
                    </div>
            </div>
            <div class="card" id="p-grade-list">
                </div>
        </div>

        <div id="view-payments" class="view-section hidden">
            <div class="section-title">수납 및 결제 내역</div>
            <div class="card">
                <div class="att-item">
                    <span>2026년 1월 교육비</span>
                    <span class="badge present">완납</span>
                </div>
                <div style="text-align: right; margin-top: 10px; font-weight: 700;">300,000원</div>
            </div>
        </div>
    </div>

    <div class="tab-bar">
        <div class="tab-item active" onclick="switchView('attendance')"><span class="tab-icon">📅</span>출결현황</div>
        <div class="tab-item" onclick="switchView('grades')"><span class="tab-icon">📊</span>성적표</div>
        <div class="tab-item" onclick="switchView('payments')"><span class="tab-icon">💳</span>수납내역</div>
        <div class="tab-item" onclick="location.reload()"><span class="tab-icon">👤</span>로그아웃</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBUZx-KxGsqYM_RyVeMhB8m6NIET1iCl0U",
        authDomain: "maniaca-965fa.firebaseapp.com",
        databaseURL: "https://maniaca-965fa-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "maniaca-965fa",
        storageBucket: "maniaca-965fa.firebasestorage.app",
        messagingSenderId: "24110097950",
        appId: "1:24110097950:web:c90fe8736b29a8b787300f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentStudent = null;
    let allData = null;

    // 1. 로그인 로직
    document.getElementById('login-btn').onclick = () => {
        const sid = document.getElementById('parent-sid').value;
        const pw = document.getElementById('parent-pw').value;

        if(!sid || !pw) return alert("정보를 입력하세요.");

        onValue(ref(db, 'maniaca'), (snapshot) => {
            const data = snapshot.val();
            if (!data) return;
            allData = data;

            const student = data.students.find(s => s.id === sid);
            // 학부모 비번은 임시로 '1234'로 설정 (나중에 원생 등록 시 추가 가능)
            if(student && pw === "1234") { 
                currentStudent = student;
                loadStudentData();
                document.getElementById('login-page').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
            } else {
                alert("번호 또는 비밀번호가 틀렸습니다.");
            }
        }, { onlyOnce: true });
    };

    // 2. 데이터 로드 및 렌더링
    function loadStudentData() {
        document.getElementById('student-name-display').innerText = `${currentStudent.name} 학생`;
        document.getElementById('student-info-display').innerText = `${currentStudent.school} | ${currentStudent.grade}`;

        // 출석 데이터
        const attList = document.getElementById('parent-att-list');
        attList.innerHTML = "";
        allData.classes.forEach(c => {
            if(c.sessions) {
                c.sessions.forEach(sess => {
                    const rec = sess.records.find(r => r.id === currentStudent.id);
                    if(rec) {
                        attList.innerHTML += `
                            <div class="att-item">
                                <div>
                                    <div style="font-weight:700;">${c.name}</div>
                                    <div style="font-size:0.8rem; color:var(--muted);">${sess.name}</div>
                                </div>
                                <span class="badge ${rec.att === '출석' ? 'present' : 'absent'}">${rec.att}</span>
                            </div>
                        `;
                    }
                });
            }
        });

        // 성적 데이터
        if(currentStudent.grades && currentStudent.grades.academy) {
            const grades = currentStudent.grades.academy;
            const avg = (grades.reduce((a,b)=>a+b.score,0)/grades.length).toFixed(1);
            document.getElementById('p-grade-avg').innerText = avg + "점";
            
            document.getElementById('parent-grade-chart').innerHTML = grades.slice(-3).map(g => `
                <div style="margin-bottom:15px;">
                    <div style="display:flex; justify-content:space-between; font-size:0.85rem; margin-bottom:5px;">
                        <span>${g.name}</span><span>${g.score}점</span>
                    </div>
                    <div class="bar-bg"><div class="bar-fill" style="width:${g.score}%"></div></div>
                </div>
            `).join('');
        }
    }

    // 3. 뷰 전환 함수
    window.switchView = (view) => {
        document.querySelectorAll('.view-section').forEach(s => s.classList.add('hidden'));
        document.getElementById('view-' + view).classList.remove('hidden');
        
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        event.currentTarget.classList.add('active');
    };
</script>

</body>
</html>
