<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>MANIACA - 가맹 학원 관리 (본사용)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        :root { 
            --admin-bg: #1e293b; --primary: #6366f1;
            --border: #e2e8f0; --bg-light: #f8fafc;
        }
        body { font-family: 'Pretendard', sans-serif; margin: 0; background: var(--bg-light); display: flex; }
        
        /* 사이드바 */
        nav { width: 280px; background: var(--admin-bg); color: white; height: 100vh; position: fixed; }
        nav h2 { text-align: center; padding: 40px 0; border-bottom: 1px solid rgba(255,255,255,0.1); margin: 0; font-weight: 900; }
        nav ul { list-style: none; padding: 20px; }
        nav li { padding: 15px 20px; background: var(--primary); border-radius: 10px; cursor: pointer; text-align: center; font-weight: 700; }

        /* 메인 컨텐츠 */
        .content { margin-left: 280px; padding: 50px; width: 100%; }
        .card { background: white; padding: 30px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 30px; }
        
        h1 { font-size: 2rem; color: #0f172a; margin-bottom: 40px; }
        h3 { margin-top: 0; color: #475569; }

        /* 입력 폼 */
        .form-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        input { padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; transition: 0.3s; }
        .btn-primary { background: var(--primary); color: white; width: 100%; }
        .btn-red { background: #fee2e2; color: #dc2626; padding: 8px 15px; }

        /* 학원 목록 테이블 */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; padding: 15px; border-bottom: 2px solid var(--border); color: #64748b; }
        td { padding: 15px; border-bottom: 1px solid var(--border); color: #1e293b; }
        tr:hover { background: #f1f5f9; }
    </style>
</head>
<body>

<nav>
    <h2>MANIACA HQ</h2>
    <ul>
        <li>가맹 학원 계정 관리</li>
    </ul>
</nav>

<div class="content">
    <h1>본사 통합 시스템 관리자</h1>

    <div class="card">
        <h3>신규 가맹 학원 계정 생성</h3>
        <div class="form-group">
            <input type="text" id="aca-name" placeholder="학원명 (예: 매니아카 대치점)">
            <input type="text" id="aca-id" placeholder="학원 관리자 아이디">
            <input type="text" id="aca-pw" placeholder="학원 관리자 비밀번호">
        </div>
        <button class="btn btn-primary" id="create-btn">가맹 학원 계정 발급</button>
    </div>

    <div class="card">
        <h3>가맹 학원 목록</h3>
        <table>
            <thead>
                <tr>
                    <th>학원명</th>
                    <th>계정 아이디</th>
                    <th>비밀번호</th>
                    <th>생성일</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody id="aca-list-body">
                </tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // Firebase 설정
    const firebaseConfig = {
        apiKey: "AIzaSyBUZx-KxGsqYM_RyVeMhB8m6NIET1iCl0U",
        authDomain: "maniaca-965fa.firebaseapp.com",
        databaseURL: "https://maniaca-965fa-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "maniaca-965fa",
        storageBucket: "maniaca-965fa.firebasestorage.app",
        messagingSenderId: "24110097950",
        appId: "1:24110097950:web:c90fe8736b29a8b787300f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 학원 생성 함수
    document.getElementById('create-btn').onclick = () => {
        const name = document.getElementById('aca-name').value;
        const id = document.getElementById('aca-id').value;
        const pw = document.getElementById('aca-pw').value;

        if(!name || !id || !pw) return alert("모든 정보를 입력해주세요.");

        const academyRef = ref(db, 'academies/' + id);
        set(academyRef, {
            name: name,
            id: id,
            pw: pw,
            createdAt: new Date().toLocaleDateString()
        }).then(() => {
            alert("신규 가맹 학원이 등록되었습니다.");
            document.getElementById('aca-name').value = "";
            document.getElementById('aca-id').value = "";
            document.getElementById('aca-pw').value = "";
        });
    };

    // 학원 목록 실시간 렌더링
    onValue(ref(db, 'academies'), (snapshot) => {
        const data = snapshot.val();
        const listBody = document.getElementById('aca-list-body');
        listBody.innerHTML = "";

        if (data) {
            Object.values(data).forEach(aca => {
                listBody.innerHTML += `
                    <tr>
                        <td><strong>${aca.name}</strong></td>
                        <td>${aca.id}</td>
                        <td>${aca.pw}</td>
                        <td>${aca.createdAt}</td>
                        <td>
                            <button class="btn btn-red" onclick="deleteAca('${aca.id}')">해지</button>
                        </td>
                    </tr>
                `;
            });
        } else {
            listBody.innerHTML = "<tr><td colspan='5' style='text-align:center;'>등록된 가맹 학원이 없습니다.</td></tr>";
        }
    });

    // 학원 계정 삭제 함수
    window.deleteAca = (id) => {
        if(confirm("해당 학원 계정을 정말 해지하시겠습니까?\n데이터는 복구되지 않습니다.")) {
            remove(ref(db, 'academies/' + id));
        }
    };
</script>

</body>
</html>
