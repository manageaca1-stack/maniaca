<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maniaca - Smart Attendance</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root { 
            --primary: #4f46e5;
            --accent: #818cf8;
            --bg-gradient: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-white: #ffffff;
        }

        body { 
            font-family: 'Pretendard', sans-serif; margin: 0; 
            background: var(--bg-gradient); color: var(--text-white);
            height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden; user-select: none; /* 드래그 방지 */
        }

        /* 배경 장식 */
        .orb { position: absolute; border-radius: 50%; filter: blur(80px); z-index: -1; }
        .orb-1 { width: 300px; height: 300px; background: #4338ca; top: -50px; left: -50px; opacity: 0.6; }
        .orb-2 { width: 400px; height: 400px; background: #be185d; bottom: -100px; right: -100px; opacity: 0.4; }

        /* 컨테이너 */
        .kiosk-container {
            background: var(--glass-bg); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 40px;
            padding: 40px; width: 90%; max-width: 450px; text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }

        /* 헤더 */
        h1 { margin: 0; font-size: 2rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 5px; }
        p.subtitle { margin: 0; color: rgba(255,255,255,0.6); font-size: 1rem; margin-bottom: 30px; }

        /* 화면 표시부 */
        .display-screen {
            background: rgba(0, 0, 0, 0.3); border-radius: 20px;
            height: 80px; display: flex; align-items: center; justify-content: center;
            margin-bottom: 30px; border: 2px solid rgba(255,255,255,0.1);
        }
        #input-display {
            font-size: 3.5rem; font-weight: 700; letter-spacing: 15px; color: white;
            text-shadow: 0 0 20px rgba(255,255,255,0.5); min-height: 60px; /* 높이 고정 */
        }

        /* 키패드 */
        .keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .key-btn {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
            color: white; font-size: 1.8rem; font-weight: 600;
            height: 80px; border-radius: 20px; cursor: pointer; transition: 0.1s;
            display: flex; align-items: center; justify-content: center;
        }
        .key-btn:active { background: rgba(255, 255, 255, 0.3); transform: scale(0.95); }
        .key-btn.clear { color: #f87171; background: rgba(239, 68, 68, 0.1); }
        .key-btn.submit { background: #4f46e5; color: white; border: none; box-shadow: 0 0 20px rgba(79, 70, 229, 0.4); }
        .key-btn.submit:active { background: #4338ca; }

        /* 알림 메시지 (Toast) */
        .toast-popup {
            position: absolute; top: 10%; left: 50%; transform: translateX(-50%) translateY(-20px);
            background: rgba(255, 255, 255, 0.95); color: #1e1b4b;
            padding: 15px 30px; border-radius: 50px; font-weight: 700; font-size: 1.1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            opacity: 0; pointer-events: none; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; align-items: center; gap: 10px; z-index: 100;
        }
        .toast-popup.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast-popup i { font-size: 1.5rem; color: #10b981; }

        /* 설정 버튼 (숨김) */
        .settings-btn { position: absolute; bottom: 20px; right: 20px; opacity: 0.3; cursor: pointer; }
        .settings-btn:hover { opacity: 1; }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="kiosk-container">
        <h1><i class="ph-fill ph-student"></i> MANIACA</h1>
        <p class="subtitle" id="school-name-display">등하원 체크 시스템</p>

        <div class="display-screen">
            <div id="input-display"></div>
        </div>

        <div class="keypad-grid">
            <div class="key-btn" onclick="pressKey(1)">1</div>
            <div class="key-btn" onclick="pressKey(2)">2</div>
            <div class="key-btn" onclick="pressKey(3)">3</div>
            <div class="key-btn" onclick="pressKey(4)">4</div>
            <div class="key-btn" onclick="pressKey(5)">5</div>
            <div class="key-btn" onclick="pressKey(6)">6</div>
            <div class="key-btn" onclick="pressKey(7)">7</div>
            <div class="key-btn" onclick="pressKey(8)">8</div>
            <div class="key-btn" onclick="pressKey(9)">9</div>
            <div class="key-btn clear" onclick="clearInput()"><i class="ph-bold ph-backspace"></i></div>
            <div class="key-btn" onclick="pressKey(0)">0</div>
            <div class="key-btn submit" onclick="submitInput()">OK</div>
        </div>
    </div>

    <div id="toast" class="toast-popup">
        <i class="ph-fill ph-check-circle"></i>
        <span id="toast-msg">등원 완료!</span>
    </div>

    <div class="settings-btn" onclick="setTargetSchool()">
        <i class="ph-fill ph-gear" style="font-size: 1.5rem; color: white;"></i>
    </div>

    <script>
        // --- 1. 데이터 연결 (LocalStorage 공유) ---
        let students = JSON.parse(localStorage.getItem('maniaca_students')) || [];
        let targetSchool = localStorage.getItem('maniaca_kiosk_school') || '전체';

        // 초기 세팅: 학원명 표시
        const titleEl = document.getElementById('school-name-display');
        if (titleEl) {
            titleEl.innerText = targetSchool === '전체' ? '등하원 체크 시스템' : `${targetSchool} 출석부`;
        }

        let currentInput = "";

        // --- 2. 입력 로직 (키보드 & 마우스 공용) ---
        // 중요: HTML onclick에서 호출하는 함수 이름을 pressKey로 통일했습니다.
        function pressKey(num) {
            const numStr = String(num); // 숫자를 문자로 변환
            if (currentInput.length < 4) {
                currentInput += numStr;
                updateDisplay();
                playSound('touch');
            }
        }

        function clearInput() {
            currentInput = "";
            updateDisplay();
        }

        function updateDisplay() {
            const display = document.getElementById('input-display');
            if (display) {
                display.innerText = currentInput;
            }
        }

        // --- 3. 등원 처리 로직 ---
        function submitInput() {
            if (currentInput.length === 0) return;

            // 데이터 최신화 (관리자 페이지에서 추가된 학생 반영)
            students = JSON.parse(localStorage.getItem('maniaca_students')) || [];

            // 학생 찾기
            const student = students.find(s => s.id === currentInput);

            if (student) {
                // 타 학원 학생 필터링
                if(targetSchool !== '전체' && student.school !== targetSchool) {
                    showToast(`❌ 우리 학원 원생이 아닙니다.`, false);
                    clearInput();
                    return;
                }

                // 로그 기록
                const now = new Date();
                if (!student.attendanceLog) student.attendanceLog = [];
                student.attendanceLog.push({
                    date: now.toLocaleDateString(),
                    time: now.toLocaleTimeString()
                });

                // 저장
                localStorage.setItem('maniaca_students', JSON.stringify(students));
                
                // 성공 알림
                showToast(`✅ ${student.name} 학생, 등원 완료!`, true);
                playSound('success');
            } else {
                // 실패 알림
                showToast(`❌ 등록되지 않은 번호입니다.`, false);
                playSound('error');
            }

            clearInput();
        }

        // --- 4. 키보드 이벤트 리스너 ---
        document.addEventListener('keydown', function(event) {
            const key = event.key;

            if (key >= '0' && key <= '9') {
                pressKey(key); // 키보드 숫자 입력
            } else if (key === 'Backspace') {
                clearInput(); // 지우기
            } else if (key === 'Enter') {
                submitInput(); // 확인
            }
        });

        // --- 5. 유틸리티 ---
        function showToast(message, isSuccess) {
            const toast = document.getElementById('toast');
            const msgSpan = document.getElementById('toast-msg');
            const icon = toast.querySelector('i');

            if (toast && msgSpan) {
                msgSpan.innerText = message;
                
                if(isSuccess) {
                    icon.className = 'ph-fill ph-check-circle';
                    icon.style.color = '#10b981'; 
                } else {
                    icon.className = 'ph-fill ph-warning-circle';
                    icon.style.color = '#ef4444'; 
                }

                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }
        }

        function playSound(type) {
            // 효과음 재생 (필요시 구현)
        }

        function setTargetSchool() {
            const input = prompt("이 태블릿을 사용할 '학원명'을 입력하세요.\n(모든 학생 허용: '전체')", targetSchool);
            if(input) {
                targetSchool = input;
                localStorage.setItem('maniaca_kiosk_school', targetSchool);
                const titleEl = document.getElementById('school-name-display');
                if(titleEl) titleEl.innerText = targetSchool === '전체' ? '등하원 체크 시스템' : `${targetSchool} 출석부`;
                alert('설정이 저장되었습니다.');
            }
        }
        
        window.addEventListener('storage', function(e) {
            if(e.key === 'maniaca_students') {
                students = JSON.parse(e.newValue);
            }
        });
    </script>
</body>
</html>
