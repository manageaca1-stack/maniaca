<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매니아카 - 전용 출석 키오스크</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #f8fafc;
            --text: #1e293b;
        }
        body {
            font-family: 'Pretendard', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #4f46e5 0%, #0f172a 100%);
            overflow: hidden;
        }
        .kiosk-card {
            background: white;
            padding: 50px;
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 500px;
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        h1 { font-size: 3rem; font-weight: 900; color: var(--primary); margin: 0; }
        p { color: #64748b; font-size: 1.2rem; margin: 10px 0 30px; }

        .display {
            background: #f1f5f9;
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: 15px;
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 30px;
            min-height: 80px;
            color: var(--text);
            border: 3px solid #e2e8f0;
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .num-btn {
            padding: 30px;
            font-size: 2rem;
            font-weight: 700;
            background: #fff;
            border: 2px solid #f1f5f9;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            transition: all 0.2s;
        }
        .num-btn:active { transform: scale(0.9); background: #f8fafc; }
        .num-btn.confirm { background: var(--primary); color: white; border: none; }
        .num-btn.clear { color: #ef4444; }

        /* 결과 알림 팝업 */
        #status-msg {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 20px 40px;
            border-radius: 20px;
            color: white;
            font-weight: 700;
            font-size: 1.5rem;
            display: none;
            z-index: 10000;
        }
    </style>
</head>
<body>

<div id="status-msg"></div>

<div class="kiosk-card">
    <h1>MANIACA</h1>
    <p>고유번호를 입력해 주세요</p>
    <div id="kiosk-display" class="display"></div>
    
    <div class="numpad">
        <button class="num-btn" onclick="press('1')">1</button>
        <button class="num-btn" onclick="press('2')">2</button>
        <button class="num-btn" onclick="press('3')">3</button>
        <button class="num-btn" onclick="press('4')">4</button>
        <button class="num-btn" onclick="press('5')">5</button>
        <button class="num-btn" onclick="press('6')">6</button>
        <button class="num-btn" onclick="press('7')">7</button>
        <button class="num-btn" onclick="press('8')">8</button>
        <button class="num-btn" onclick="press('9')">9</button>
        <button class="num-btn clear" onclick="press('clear')">C</button>
        <button class="num-btn" onclick="press('0')">0</button>
        <button class="num-btn confirm" id="confirm-btn">확인</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // Firebase 설정 (기존과 동일)
    const firebaseConfig = {
        apiKey: "AIzaSyBUZx-KxGsqYM_RyVeMhB8m6NIET1iCl0U",
        authDomain: "maniaca-965fa.firebaseapp.com",
        databaseURL: "https://maniaca-965fa-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "maniaca-965fa",
        storageBucket: "maniaca-965fa.firebasestorage.app",
        messagingSenderId: "24110097950",
        appId: "1:24110097950:web:c90fe8736b29a8b787300f",
        measurementId: "G-CDGPKJLT8B"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentInput = "";
    const display = document.getElementById('kiosk-display');

    // 숫자 패드 입력 함수
    window.press = (val) => {
        if(val === 'clear') {
            currentInput = "";
        } else if (currentInput.length < 6) { // 번호 길이에 맞춰 조절 가능
            currentInput += val;
        }
        display.innerText = currentInput;
    };

    // 알림 표시 함수
    function showStatus(text, isError = false) {
        const msg = document.getElementById('status-msg');
        msg.innerText = text;
        msg.style.backgroundColor = isError ? "#ef4444" : "#10b981";
        msg.style.display = "block";
        setTimeout(() => { msg.style.display = "none"; }, 3000);
    }

    // ★ 핵심 출석 로직 ★
    document.getElementById('confirm-btn').onclick = async () => {
        if(!currentInput) return;

        try {
            const snapshot = await get(ref(db, 'maniaca'));
            const data = snapshot.val();
            
            if (!data) return showStatus("데이터를 불러올 수 없습니다.", true);

            const students = data.students || [];
            const classes = data.classes || [];
            
            // 1. 학생 찾기
            const student = students.find(s => s.id === currentInput);
            if(!student) {
                showStatus("등록되지 않은 번호입니다.", true);
                currentInput = "";
                display.innerText = "";
                return;
            }

            // 2. 출석 처리 (오늘 날짜와 매칭되는 수업/차시가 있다면)
            let success = false;
            classes.forEach(c => {
                if(c.sessions) {
                    c.sessions.forEach(sess => {
                        // 실제로는 '오늘 날짜'와 비교하는 로직이 필요하나, 
                        // 테스트를 위해 해당 학생이 포함된 모든 차시의 '미출석'을 '출석'으로 변경
                        const record = sess.records.find(r => r.id === student.id);
                        if(record && record.att !== "출석") {
                            record.att = "출석";
                            success = true;
                        }
                    });
                }
            });

            if(success) {
                await set(ref(db, 'maniaca'), data); // 변경된 데이터 DB 업데이트
                showStatus(`${student.name} 학생, 출석 완료되었습니다!`);
            } else {
                showStatus(`${student.name} 학생, 이미 출석했거나 수업이 없습니다.`);
            }

            // 입력 초기화
            currentInput = "";
            display.innerText = "";

        } catch (err) {
            console.error(err);
            showStatus("통신 오류가 발생했습니다.", true);
        }
    };
</script>

</body>
</html>
