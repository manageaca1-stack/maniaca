<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maniaca Enterprise - Integrated Academy Solution</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* =========================================
           1. Core Design System (Glassmorphism 2.0)
           ========================================= */
        :root {
            --p-color: #6366f1;         --p-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --bg-glass: rgba(255, 255, 255, 0.7);
            --border-glass: rgba(255, 255, 255, 0.4);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --text-primary: #0f172a;    --text-secondary: #475569;
            --radius-main: 24px;        --radius-sm: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
        body { 
            background: radial-gradient(at top left, #e0e7ff, transparent), radial-gradient(at bottom right, #f3e8ff, transparent);
            background-color: #f8fafc; height: 100vh; overflow: hidden; color: var(--text-primary);
        }

        /* Utils */
        .flex { display: flex; } .items-center { align-items: center; } .justify-between { justify-content: space-between; }
        .hidden { display: none !important; } .gap-4 { gap: 1rem; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.2); border-radius: 10px; }

        /* =========================================
           2. Layout Components
           ========================================= */
        
        /* Auth Overlay */
        #auth-layer {
            position: fixed; inset: 0; z-index: 10000;
            background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
            display: flex; align-items: center; justify-content: center;
        }
        .auth-card {
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px);
            padding: 3rem; border-radius: 32px; width: 440px; text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .input-group { margin-bottom: 1.5rem; text-align: left; }
        .input-group label { display: block; margin-bottom: 0.5rem; font-size: 14px; font-weight: 600; color: var(--text-secondary); }
        .input-field { 
            width: 100%; padding: 14px 20px; border-radius: var(--radius-sm); border: 1px solid #e2e8f0;
            background: #f8fafc; font-size: 16px; transition: 0.3s;
        }
        .input-field:focus { border-color: var(--p-color); box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); outline: none; }

        /* Sidebar Navigation */
        #app-container { display: none; height: 100vh; }
        .app-sidebar {
            width: 280px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px);
            display: flex; flex-direction: column; padding: 2rem 1rem;
        }
        .brand { 
            color: white; font-size: 24px; font-weight: 800; padding-left: 1.5rem;
            margin-bottom: 3rem; letter-spacing: -1px;
        }
        .nav-item {
            padding: 14px 20px; border-radius: 16px; color: #94a3b8; cursor: pointer;
            transition: 0.3s; font-weight: 500; margin-bottom: 0.5rem; border: 1px solid transparent;
        }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .nav-item.active { background: var(--p-color); color: white; box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4); }
        .nav-item i { margin-right: 12px; font-size: 18px; }

        /* Main Workspace */
        .workspace { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .top-bar {
            height: 80px; background: var(--bg-glass); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-glass); padding: 0 2.5rem;
        }
        .main-content { flex: 1; padding: 2.5rem; overflow-y: auto; }
        
        /* Dashboard Card */
        .glass-card {
            background: var(--bg-glass); backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass); border-radius: var(--radius-main);
            padding: 2rem; box-shadow: var(--shadow-lg); margin-bottom: 2rem;
        }

        /* =========================================
           3. Professional Table & Controls
           ========================================= */
        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        th { text-align: left; padding: 12px 20px; color: var(--text-secondary); font-size: 13px; font-weight: 600; }
        td { background: white; padding: 16px 20px; border-top: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9; }
        td:first-child { border-left: 1px solid #f1f5f9; border-top-left-radius: 12px; border-bottom-left-radius: 12px; }
        td:last-child { border-right: 1px solid #f1f5f9; border-top-right-radius: 12px; border-bottom-right-radius: 12px; }
        
        .btn { 
            padding: 10px 20px; border-radius: 12px; font-weight: 600; cursor: pointer;
            transition: 0.2s; border: none; font-size: 14px;
        }
        .btn-p { background: var(--p-color); color: white; }
        .btn-p:hover { opacity: 0.9; transform: translateY(-1px); }
        
        /* Messenger Enterprise */
        .chat-container { height: calc(100vh - 200px); display: flex; gap: 1.5rem; }
        .chat-list { width: 320px; border-radius: 24px; background: var(--bg-glass); padding: 1.5rem; }
        .chat-room { flex: 1; border-radius: 24px; background: white; display: flex; flex-direction: column; overflow: hidden; }
        .msg-area { flex: 1; padding: 1.5rem; overflow-y: auto; background: #f8fafc; }
        .bubble { max-width: 75%; padding: 12px 18px; border-radius: 20px; font-size: 14px; line-height: 1.6; margin-bottom: 1rem; position: relative; }
        .mine { align-self: flex-end; background: var(--p-color); color: white; border-bottom-right-radius: 4px; }
        .yours { align-self: flex-start; background: #f1f5f9; border-bottom-left-radius: 4px; }

        /* Animation */
        .page-fade { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Badge Styles */
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .status-active { background: #dcfce7; color: #166534; }
        .status-pending { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

    <div id="auth-layer">
        <div class="auth-card">
            <h1 style="margin-bottom: 1rem; letter-spacing: -2px; font-weight: 900; font-size: 32px;">MANIACA <span style="font-weight: 300;">OS</span></h1>
            <p style="color: #64748b; margin-bottom: 2rem;">전문가급 학원 운영 자동화 시스템</p>
            <div class="input-group">
                <label>ID</label>
                <input type="text" id="auth-id" class="input-field" placeholder="ID를 입력하세요">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="auth-pw" class="input-field" placeholder="••••••••">
            </div>
            <button class="btn btn-p" style="width: 100%; padding: 16px;" onclick="Maniaca.auth.login()">시스템 접속하기</button>
        </div>
    </div>

    <div id="app-container" class="flex">
        <nav class="app-sidebar">
            <div class="brand">MANIACA.</div>
            <div class="nav-group">
                <div class="nav-item director-only active" onclick="Maniaca.ui.switchPage('crm')"><i class="fa-solid fa-user-group"></i>학생 관리</div>
                <div class="nav-item director-only" onclick="Maniaca.ui.switchPage('counsel')"><i class="fa-solid fa-comment-dots"></i>상담 기록</div>
                <div class="nav-item director-only" onclick="Maniaca.ui.switchPage('erp')"><i class="fa-solid fa-credit-card"></i>수납/회계</div>
                <div class="nav-item director-only" onclick="Maniaca.ui.switchPage('lms')"><i class="fa-solid fa-graduation-cap"></i>학사/출결</div>
                <div class="nav-item director-only" onclick="Maniaca.ui.switchPage('hr')"><i class="fa-solid fa-briefcase"></i>강사 관리</div>
                <div class="nav-item" onclick="Maniaca.ui.switchPage('messenger')"><i class="fa-solid fa-paper-plane"></i>메신저</div>
                <div class="nav-item admin-only" onclick="Maniaca.ui.switchPage('super-admin')"><i class="fa-solid fa-building-columns"></i>가맹점 관리</div>
            </div>
            <div style="margin-top: auto; padding: 1.5rem;">
                <button class="btn btn-gray" style="width: 100%; background: rgba(255,255,255,0.1); color: white;" onclick="Maniaca.auth.logout()">로그아웃</button>
            </div>
        </nav>

        <main class="workspace">
            <header class="top-bar flex items-center justify-between">
                <h2 id="page-display-title" style="font-size: 22px; font-weight: 800;">학생 관리</h2>
                <div class="flex items-center gap-4">
                    <span id="user-info-text" style="font-weight: 600; color: var(--text-secondary);"></span>
                    <div style="width: 40px; height: 40px; background: var(--p-gradient); border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold;" id="user-avatar">A</div>
                </div>
            </header>

            <div class="main-content">
                <section id="crm-page" class="view-section page-fade active">
                    <div class="flex justify-between items-center" style="margin-bottom: 2rem;">
                        <div class="flex gap-4">
                            <input type="text" placeholder="이름 혹은 고유번호 검색" class="input-field" style="width: 320px;">
                            <button class="btn btn-p"><i class="fa-solid fa-magnifying-glass"></i></button>
                        </div>
                        <button class="btn btn-p" onclick="Maniaca.ui.openModal('student-reg-modal')">+ 신규 학생 등록</button>
                    </div>
                    <div class="glass-card">
                        <table id="student-table-main">
                            <thead><tr><th>ID</th><th>이름</th><th>학교/학년</th><th>학생 연락처</th><th>상태</th><th>관리</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </section>

                <section id="messenger-page" class="view-section page-fade hidden">
                    <div class="chat-container">
                        <div class="chat-list">
                            <div class="flex justify-between items-center" style="margin-bottom: 1.5rem;">
                                <h4 style="font-weight: 800; font-size: 18px;">Chat</h4>
                                <button class="btn btn-p" style="padding: 6px 12px; font-size: 12px;" onclick="Maniaca.messenger.openNewRoom()">+ New</button>
                            </div>
                            <div id="chat-rooms-render"></div>
                        </div>
                        <div class="chat-room">
                            <div id="chat-header" style="padding: 1.25rem 1.5rem; border-bottom: 1px solid #f1f5f9; font-weight: 700; font-size: 16px;">채팅방을 선택하세요</div>
                            <div class="msg-area flex flex-direction-column" id="msg-render-body" style="display: flex; flex-direction: column;"></div>
                            <div id="chat-input-box" class="flex gap-4" style="padding: 1.5rem; border-top: 1px solid #f1f5f9; display: none;">
                                <input type="text" id="msg-input-field" class="input-field" placeholder="메시지를 입력하세요..." onkeypress="if(event.key==='Enter') Maniaca.messenger.sendMessage()">
                                <button class="btn btn-p" onclick="Maniaca.messenger.sendMessage()">전송</button>
                            </div>
                        </div>
                    </div>
                </section>

                <section id="super-admin-page" class="view-section page-fade hidden">
                    <div class="glass-card">
                        <h3>가맹 학원 및 파트너 계정 관리</h3>
                        <table style="margin-top: 2rem;">
                            <thead><tr><th>학원명</th><th>원장명</th><th>계정 ID</th><th>관리</th></tr></thead>
                            <tbody id="academy-list-body"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <div id="student-reg-modal" class="modal hidden" style="position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:99999; display:none; align-items:center; justify-content:center;">
        <div class="auth-card" style="width: 600px;">
            <h3 style="margin-bottom: 2rem;">신규 원생 등록</h3>
            <div class="flex gap-4">
                <div class="input-group" style="flex:1"><label>고유번호</label><input type="text" id="reg-id" class="input-field"></div>
                <div class="input-group" style="flex:1"><label>이름</label><input type="text" id="reg-name" class="input-field"></div>
            </div>
            <div class="input-group"><label>학생 연락처</label><input type="text" id="reg-phone" class="input-field"></div>
            <div style="text-align: right; margin-top: 2rem;">
                <button class="btn btn-gray" onclick="Maniaca.ui.closeModal('student-reg-modal')">취소</button>
                <button class="btn btn-p" onclick="Maniaca.students.register()">데이터 저장하기</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, update, remove, onChildAdded, off } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase Config (선생님 고유 설정)
        const firebaseConfig = {
            apiKey: "AIzaSyBUZx-KxGsqYM_RyVeMhB8m6NIET1iCl0U",
            authDomain: "maniaca-965fa.firebaseapp.com",
            databaseURL: "https://maniaca-965fa-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "maniaca-965fa",
            storageBucket: "maniaca-965fa.firebasestorage.app",
            messagingSenderId: "24110097950",
            appId: "1:24110097950:web:c90fe8736b29a8b787300f",
            measurementId: "G-CDGPKJLT8B"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        /* =========================================
           MANIACA CORE OBJECT (Expert Module)
           ========================================= */
        const Maniaca = {
            state: {
                currentUser: null,
                activeChatId: null,
                chatRef: null,
                students: [],
                academies: []
            },

            auth: {
                login() {
                    const id = document.getElementById('auth-id').value;
                    const pw = document.getElementById('auth-pw').value;
                    
                    if(id === 'admin' && pw === '1234') {
                        this.onLoginSuccess({ id: 'admin', role: 'super_admin', name: '사이트 총괄', aca: 'Maniaca HQ' });
                    } else {
                        // 학원 DB 검증 (onValue promise wrapper)
                        onValue(ref(db, 'academies'), snap => {
                            const data = snap.val();
                            let found = null;
                            if(data) Object.values(data).forEach(a => { if(a.id === id && a.pw === pw) found = a; });
                            if(found) this.onLoginSuccess({ ...found, role: 'director' });
                            else alert("계정 정보가 일치하지 않습니다.");
                        }, { onlyOnce: true });
                    }
                },

                onLoginSuccess(user) {
                    Maniaca.state.currentUser = user;
                    localStorage.setItem('maniaca_session', JSON.stringify(user));
                    
                    document.getElementById('auth-layer').classList.add('hidden');
                    document.getElementById('app-container').style.display = 'flex';
                    document.getElementById('user-info-text').innerText = user.name;
                    document.getElementById('user-avatar').innerText = user.name[0];

                    // Role Based Access Control (RBAC)
                    if(user.role === 'super_admin') {
                        document.querySelectorAll('.director-only').forEach(e => e.style.display = 'none');
                        document.querySelectorAll('.admin-only').forEach(e => e.style.display = 'block');
                        Maniaca.ui.switchPage('super-admin');
                    } else {
                        document.querySelectorAll('.director-only').forEach(e => e.style.display = 'block');
                        document.querySelectorAll('.admin-only').forEach(e => e.style.display = 'none');
                        Maniaca.ui.switchPage('crm');
                        Maniaca.students.init();
                    }
                    Maniaca.messenger.init();
                    Maniaca.superAdmin.init();
                },

                logout() {
                    localStorage.removeItem('maniaca_session');
                    location.reload();
                },

                initSession() {
                    const saved = localStorage.getItem('maniaca_session');
                    if(saved) this.onLoginSuccess(JSON.parse(saved));
                }
            },

            ui: {
                switchPage(pageId) {
                    document.querySelectorAll('.view-section').forEach(s => s.classList.add('hidden'));
                    const target = document.getElementById(`${pageId}-page`);
                    if(target) target.classList.remove('hidden');

                    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                    const nav = document.querySelector(`.nav-item[onclick*="'${pageId}'"]`);
                    if(nav) nav.classList.add('active');

                    document.getElementById('page-display-title').innerText = nav ? nav.innerText : 'Dashboard';
                },

                openModal(id) { document.getElementById(id).style.display = 'flex'; },
                closeModal(id) { document.getElementById(id).style.display = 'none'; }
            },

            students: {
                init() {
                    onValue(ref(db, 'students'), snap => {
                        const data = snap.val();
                        const tbody = document.querySelector('#student-table-main tbody');
                        tbody.innerHTML = "";
                        if(data) {
                            Object.entries(data).forEach(([key, s]) => {
                                const tr = `<tr>
                                    <td style="font-weight:700;">${s.id}</td>
                                    <td style="font-weight:600;">${s.name}</td>
                                    <td style="color:var(--text-secondary);">${s.school || '-'}</td>
                                    <td>${s.phone || '-'}</td>
                                    <td><span class="badge status-active">재원중</span></td>
                                    <td><button class="btn btn-gray" style="padding:6px 12px" onclick="Maniaca.students.remove('${key}')">삭제</button></td>
                                </tr>`;
                                tbody.innerHTML += tr;
                            });
                        }
                    });
                },
                register() {
                    const id = document.getElementById('reg-id').value;
                    const name = document.getElementById('reg-name').value;
                    if(!id || !name) return alert("필수값을 확인하세요");
                    set(ref(db, `students/${id}`), { 
                        id, name, 
                        phone: document.getElementById('reg-phone').value,
                        createdAt: Date.now() 
                    }).then(() => Maniaca.ui.closeModal('student-reg-modal'));
                },
                remove(id) { if(confirm("데이터를 영구 삭제합니까?")) remove(ref(db, `students/${id}`)); }
            },

            messenger: {
                init() {
                    // 실시간 채팅방 구독
                    onValue(ref(db, 'chats'), snap => {
                        const data = snap.val();
                        const render = document.getElementById('chat-rooms-render');
                        render.innerHTML = "";
                        if(data) {
                            Object.entries(data)
                                .filter(([_, chat]) => chat.members.includes(Maniaca.state.currentUser.id))
                                .sort((a,b) => (b[1].lastTime || 0) - (a[1].lastTime || 0))
                                .forEach(([id, chat]) => {
                                    const div = document.createElement('div');
                                    div.className = `nav-item ${Maniaca.state.activeChatId === id ? 'active' : ''}`;
                                    div.style.background = Maniaca.state.activeChatId === id ? 'var(--p-color)' : 'rgba(255,255,255,0.4)';
                                    div.style.color = Maniaca.state.activeChatId === id ? 'white' : 'var(--text-primary)';
                                    div.innerHTML = `<div><div style="font-weight:800">${chat.name}</div><div style="font-size:11px; opacity:0.7">${chat.lastMsg || ''}</div></div>`;
                                    div.onclick = () => this.selectRoom(id, chat.name);
                                    render.appendChild(div);
                                });
                        }
                    });
                },

                selectRoom(id, name) {
                    if(Maniaca.state.chatRef) off(Maniaca.state.chatRef);
                    
                    Maniaca.state.activeChatId = id;
                    document.getElementById('chat-header').innerText = name;
                    document.getElementById('chat-input-box').style.display = 'flex';
                    const body = document.getElementById('msg-render-body');
                    body.innerHTML = "";

                    Maniaca.state.chatRef = ref(db, `chats/${id}/messages`);
                    onChildAdded(Maniaca.state.chatRef, snap => {
                        const m = snap.val();
                        const isMine = m.sid === Maniaca.state.currentUser.id;
                        const msgDiv = `<div class="bubble ${isMine ? 'mine' : 'yours'}">
                            <div style="font-size:10px; opacity:0.6; margin-bottom:2px;">${m.sname}</div>
                            ${m.txt}
                        </div>`;
                        body.insertAdjacentHTML('beforeend', msgDiv);
                        body.scrollTop = body.scrollHeight;
                    });
                },

                sendMessage() {
                    const inp = document.getElementById('msg-input-field');
                    const txt = inp.value.trim();
                    if(!txt || !Maniaca.state.activeChatId) return;

                    const now = Date.now();
                    const path = `chats/${Maniaca.state.activeChatId}`;
                    
                    // 메시지 푸시 & 방 상태 업데이트 (Atomic Update)
                    push(ref(db, `${path}/messages`), {
                        sid: Maniaca.state.currentUser.id,
                        sname: Maniaca.state.currentUser.name,
                        txt, time: now
                    });
                    update(ref(db, path), { lastMsg: txt, lastTime: now });
                    inp.value = "";
                },

                openNewRoom() {
                    // 학원 목록을 이용한 채팅 초대 로직
                    onValue(ref(db, 'academies'), snap => {
                        const data = snap.val();
                        if(!data) return alert("대화할 상대가 없습니다.");
                        const targetId = prompt("대화할 학원의 ID를 입력하세요 (예: director)");
                        if(!targetId) return;
                        
                        const roomName = prompt("방 이름을 정해주세요", `${targetId}님과의 대화`);
                        const newChatRef = push(ref(db, 'chats'));
                        set(newChatRef, {
                            id: newChatRef.key,
                            name: roomName,
                            members: [Maniaca.state.currentUser.id, targetId],
                            lastMsg: '채팅방이 개설되었습니다.',
                            lastTime: Date.now()
                        });
                    }, { onlyOnce: true });
                }
            },

            superAdmin: {
                init() {
                    onValue(ref(db, 'academies'), snap => {
                        const data = snap.val();
                        const tbody = document.getElementById('academy-list-body');
                        if(!tbody) return;
                        tbody.innerHTML = "";
                        if(data) {
                            Object.entries(data).forEach(([key, a]) => {
                                tbody.innerHTML += `<tr>
                                    <td><span style="font-weight:700">${a.name}</span></td>
                                    <td>${a.owner}</td>
                                    <td style="font-family:monospace; color:var(--p-color); font-weight:bold;">${a.id}</td>
                                    <td><button class="btn btn-gray" style="padding:6px 12px" onclick="Maniaca.superAdmin.remove('${key}')">폐쇄</button></td>
                                </tr>`;
                            });
                        }
                    });
                },
                remove(key) { if(confirm("학원 계정을 영구 삭제합니까?")) remove(ref(db, `academies/${key}`)); }
            }
        };

        // Initialize Application
        window.Maniaca = Maniaca;
        Maniaca.auth.initSession();

    </script>
</body>
</html>
