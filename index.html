<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>MANIACA V2</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {getDatabase,ref,get,set,push,onValue} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

const app=initializeApp({
 databaseURL:"https://maniaca-db-5632f-default-rtdb.asia-southeast1.firebasedatabase.app"
});
const db=getDatabase(app);
let academyId=null, selStudent=null, selClass=null;

const $=id=>document.getElementById(id);

/* -------- Landing / Login -------- */
window.gotoLogin=()=>{$("landing").classList.add("hidden");$("login").classList.remove("hidden");}
window.login=async()=>{
 const id=$("lgId").value, pw=$("lgPw").value;
 const s=await get(ref(db,"accounts/"+id));
 if(!s.exists()||s.val().password!==pw) return alert("로그인 실패");
 academyId=s.val().academyId;
 $("login").classList.add("hidden");$("app").classList.remove("hidden");
 loadStudents(); loadClasses(); loadPayments();
}

/* -------- Students -------- */
function loadStudents(){
 onValue(ref(db,`academyData/${academyId}/students`),snap=>{
  const list=Object.values(snap.val()||{});
  $("students").innerHTML=`<button onclick="openAddStudent()" class="btn">+ 원생등록</button>`+
   `<table class="mt-3 w-full border">${list.map(s=>`
    <tr class="border">
     <td class="p-2 cursor-pointer" onclick="openStudent('${s.id}')">${s.name}</td>
     <td>${s.school}</td>
     <td><button onclick="openLevel('${s.id}')">레벨</button></td>
    </tr>`).join("")}</table>`;
 });
}
window.openAddStudent=()=>{
 $("students").innerHTML+=`
 <div class="mt-3 space-y-2">
  <input id="sn" placeholder="이름"><input id="sno" placeholder="고유번호">
  <input id="ss" placeholder="학교"><input id="sg" placeholder="학년">
  <input id="pp1" placeholder="부모1"><input id="pp2" placeholder="부모2">
  <input id="sp" placeholder="학생전화">
  <button onclick="saveStudent()">저장</button>
 </div>`;
}
window.saveStudent=async()=>{
 const id=Date.now();
 await set(ref(db,`academyData/${academyId}/students/${id}`),{
  id,name:sn.value,studentNo:sno.value,school:ss.value,grade:sg.value,
  parentPhone1:pp1.value,parentPhone2:pp2.value,studentPhone:sp.value
 });
}
window.openStudent=id=>{selStudent=id; alert("학생 선택됨");}
window.openLevel=async(id)=>{
 const v=prompt("점수,등급 (예: 90,A)");
 if(!v) return;
 const [score,grade]=v.split(",");
 await set(ref(db,`academyData/${academyId}/students/${id}/levelTest`),{score,grade});
}

/* -------- Classes / Sessions -------- */
function loadClasses(){
 onValue(ref(db,`academyData/${academyId}/classes`),snap=>{
  const list=Object.values(snap.val()||{});
  $("classes").innerHTML=`<button onclick="addClass()">+ 수업추가</button>`+
   list.map(c=>`<div class="mt-2">
    <b onclick="selClass='${c.id}'">${c.name}</b>
    <button onclick="addSession('${c.id}')">차시+</button>
   </div>`).join("");
 });
}
window.addClass=async()=>{
 const name=prompt("수업명"); if(!name) return;
 const id=push(ref(db,`academyData/${academyId}/classes`)).key;
 await set(ref(db,`academyData/${academyId}/classes/${id}`),{id,name});
}
window.addSession=async(cid)=>{
 const name=prompt("차시명"); if(!name) return;
 const sid=push(ref(db,`academyData/${academyId}/classes/${cid}/sessions`)).key;
 await set(ref(db,`academyData/${academyId}/classes/${cid}/sessions/${sid}`),{id:sid,name});
}

/* -------- Payments -------- */
function loadPayments(){
 onValue(ref(db,`academyData/${academyId}/payments`),snap=>{
  const list=Object.values(snap.val()||{});
  $("payments").innerHTML=`<button onclick="addPay()">+ 수납</button>`+
   list.map(p=>`<div>${p.month} / ${p.studentName} / ${p.amount}</div>`).join("");
 });
}
window.addPay=async()=>{
 const st=prompt("학생명"), amt=prompt("금액"), m=prompt("월 (2026-01)");
 const id=push(ref(db,`academyData/${academyId}/payments`)).key;
 await set(ref(db,`academyData/${academyId}/payments/${id}`),{id,studentName:st,amount:amt,month:m});
}
</script>
</head>

<body class="p-6">
<section id="landing" class="text-center">
 <h1 class="text-4xl font-bold">MANIACA</h1>
 <button onclick="gotoLogin()" class="mt-4 bg-black text-white px-6 py-2 rounded">시작하기</button>
</section>

<section id="login" class="hidden">
 <input id="lgId" placeholder="ID">
 <input id="lgPw" placeholder="PW">
 <button onclick="login()">로그인</button>
</section>

<section id="app" class="hidden mt-6 grid grid-cols-3 gap-4">
 <div id="students"></div>
 <div id="classes"></div>
 <div id="payments"></div>
</section>
</body>
</html>
