<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maniaca Enterprise - Realtime System</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* =========================================
           1. Core CSS (Glassmorphism & Layout)
           ========================================= */
        :root {
            --p-color: #6366f1; --p-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --bg-glass: rgba(255, 255, 255, 0.7); --border-glass: rgba(255, 255, 255, 0.4);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1); --text-primary: #0f172a;
            --text-secondary: #475569; --radius-main: 24px; --radius-sm: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
        body { background: radial-gradient(at top left, #e0e7ff, transparent), radial-gradient(at bottom right, #f3e8ff, transparent); background-color: #f8fafc; height: 100vh; overflow: hidden; color: var(--text-primary); }
        .flex { display: flex; } .items-center { align-items: center; } .justify-between { justify-content: space-between; } .hidden { display: none !important; } .gap-4 { gap: 1rem; }
        
        /* Layout */
        #auth-layer { position: fixed; inset: 0; z-index: 10000; background: var(--p-gradient); display: flex; align-items: center; justify-content: center; }
        #app-container { display: none; height: 100vh; }
        .app-sidebar { width: 280px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); display: flex; flex-direction: column; padding: 2rem 1rem; }
        .nav-item { padding: 14px 20px; border-radius: 16px; color: #94a3b8; cursor: pointer; transition: 0.3s; font-weight: 500; margin-bottom: 0.5rem; }
        .nav-item.active { background: var(--p-color); color: white; box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4); }
        .workspace { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .top-bar { height: 80px; background: var(--bg-glass); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-glass); padding: 0 2.5rem; }
        .main-content { flex: 1; padding: 2.5rem; overflow-y: auto; }
        
        /* Table & Cards */
        .glass-card { background: var(--bg-glass); backdrop-filter: blur(12px); border: 1px solid var(--border-glass); border-radius: var(--radius-main); padding: 2rem; box-shadow: var(--shadow-lg); margin-bottom: 2rem; }
        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        th { text-align: left; padding: 12px 20px; color: var(--text-secondary); font-size: 13px; font-weight: 600; }
        td { background: white; padding: 16px 20px; border-top: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9; }
        td:first-child { border-left: 1px solid #f1f5f9; border-top-left-radius: 12px; border-bottom-left-radius: 12px; }
        td:last-child { border-right: 1px solid #f1f5f9; border-top-right-radius: 12px; border-bottom-right-radius: 12px; }
        
        /* Buttons */
        .btn { padding: 10px 20px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; border: none; font-size: 14px; }
        .btn-p { background: var(--p-color); color: white; }
        .btn-gray { background: #e2e8f0; color: var(--text-secondary); }

        /* Detail Profile */
        .profile-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .profile-tab-btn { flex: 1; padding: 14px; border-radius: 12px; border: 1px solid #e2e8f0; background: white; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .profile-tab-btn.active { background: var(--p-color); color: white; border-color: var(--p-color); }
        
        /* Graph Styles */
        .graph-container { display: flex; align-items: flex-end; height: 240px; gap: 20px; padding: 20px; border-bottom: 2px solid #f1f5f9; justify-content: center; }
        .graph-bar-wrapper { width: 50px; display: flex; flex-direction: column; align-items: center; gap: 10px; height: 100%; justify-content: flex-end; }
        .graph-bar { width: 100%; background: var(--p-gradient); border-top-left-radius: 8px; border-top-right-radius: 8px; transition: height 1s cubic-bezier(0.17, 0.67, 0.83, 0.67); }
        .graph-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); }

        /* Messenger */
        .bubble { max-width: 75%; padding: 12px 18px; border-radius: 20px; font-size: 14px; margin-bottom: 1rem; position: relative; }
        .mine { align-self: flex-end; background: var(--p-color); color: white; border-bottom-right-radius: 4px; }
        .yours { align-self: flex-start; background: #f1f5f9; border-bottom-left-radius: 4px; }
        
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
        .bg-ok { background: #dcfce7; color: #166534; }
        .bg-err { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

    <div id="auth-layer">
        <div class="auth-card" style="background:white; padding:3rem; border-radius:32px; width:400px; text-align:center;">
            <h1 style="margin-bottom: 1rem;">MANIACA <span style="font-weight:300;">OS</span></h1>
            <input type="text" id="auth-id" placeholder="ID" style="width:100%; padding:14px; margin-bottom:10px; border-radius:12px; border:1px solid #ddd;">
            <input type="password" id="auth-pw" placeholder="PW" style="width:100%; padding:14px; margin-bottom:20px; border-radius:12px; border:1px solid #ddd;">
            <button class="btn btn-p" style="width:100%;" onclick="Maniaca.auth.login()">접속</button>
        </div>
    </div>

    <div id="app-container" class="flex">
        <nav class="app-sidebar">
            <div style="color:white; font-size:24px; font-weight:800; margin-bottom:3rem; padding-left:1rem;">MANIACA.</div>
            <div class="nav-item director-only active" onclick="Maniaca.ui.switchPage('crm')"><i class="fa-solid fa-user-group" style="margin-right:10px;"></i>학생 관리</div>
            <div class="nav-item director-only" onclick="Maniaca.ui.switchPage('messenger')"><i class="fa-solid fa-paper-plane" style="margin-right:10px;"></i>메신저</div>
            <div class="nav-item admin-only" onclick="Maniaca.ui.switchPage('super-admin')"><i class="fa-solid fa-building-columns" style="margin-right:10px;"></i>학원 관리</div>
            <button class="btn btn-gray" style="margin-top:auto;" onclick="Maniaca.auth.logout()">로그아웃</button>
        </nav>

        <main class="workspace">
            <header class="top-bar flex items-center justify-between">
                <h2 id="page-title" style="font-weight:800;">학생 관리</h2>
                <div id="user-info" style="font-weight:600;"></div>
            </header>

            <div class="main-content">
                <section id="crm-page" class="view-section active">
                    <div class="flex justify-between" style="margin-bottom:2rem;">
                        <button class="btn btn-p" onclick="Maniaca.ui.openModal('reg-modal')">+ 학생 등록</button>
                    </div>
                    <div class="glass-card">
                        <table>
                            <thead><tr><th>ID</th><th>이름</th><th>학교</th><th>상태</th><th>관리</th></tr></thead>
                            <tbody id="student-tbody"></tbody>
                        </table>
                    </div>
                </section>

                <section id="detail-page" class="view-section hidden">
                    <div class="flex items-center gap-4" style="margin-bottom: 2rem;">
                        <button class="btn btn-gray" onclick="Maniaca.ui.switchPage('crm')"><i class="fa-solid fa-arrow-left"></i></button>
                        <h2 id="det-name" style="font-size: 28px; font-weight: 800;">학생 이름</h2>
                        <span id="det-school" style="color:var(--text-secondary);">학교 정보</span>
                    </div>

                    <div class="profile-tabs">
                        <button class="profile-tab-btn active" onclick="Maniaca.students.loadDetail('score')">💯 성적 분석</button>
                        <button class="profile-tab-btn" onclick="Maniaca.students.loadDetail('attend')">🕒 통합 출결</button>
                    </div>

                    <div id="det-section-score" class="detail-sub-section active">
                        <div class="glass-card">
                            <h3>성적 추이 그래프</h3>
                            <div class="graph-container" id="score-graph-render"></div>
                            <div style="margin-top: 2rem; display: flex; gap: 10px;">
                                <input type="text" id="new-score-name" placeholder="시험명" class="btn" style="background:white; border:1px solid #ddd; flex:2;">
                                <input type="number" id="new-score-val" placeholder="점수" class="btn" style="background:white; border:1px solid #ddd; flex:1;">
                                <button class="btn btn-p" onclick="Maniaca.students.addScore()">기록 추가</button>
                            </div>
                        </div>
                    </div>

                    <div id="det-section-attend" class="detail-sub-section hidden">
                        <div class="glass-card">
                            <h3>통합 출결 이력</h3>
                            <table>
                                <thead><tr><th>날짜</th><th>상태</th><th>비고</th></tr></thead>
                                <tbody id="attend-history-render"></tbody>
                            </table>
                        </div>
                    </div>
                </section>

                <section id="messenger-page" class="view-section hidden">
                    <div class="flex" style="height: 600px; gap: 20px;">
                        <div class="glass-card" style="width: 300px;" id="chat-list-render"></div>
                        <div class="glass-card" style="flex: 1; display:flex; flex-direction:column;">
                            <div id="chat-room-body" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; padding:10px;"></div>
                            <div class="flex gap-4" style="padding-top:20px;">
                                <input type="text" id="m-input" style="flex:1; padding:10px; border-radius:10px; border:1px solid #ddd;">
                                <button class="btn btn-p" onclick="Maniaca.messenger.send()">전송</button>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBUZx-KxGsqYM_RyVeMhB8m6NIET1iCl0U",
            authDomain: "maniaca-965fa.firebaseapp.com",
            databaseURL: "https://maniaca-965fa-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "maniaca-965fa",
            storageBucket: "maniaca-965fa.firebasestorage.app",
            messagingSenderId: "24110097950",
            appId: "1:24110097950:web:c90fe8736b29a8b787300f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        /* =========================================
           MANIACA PRO ARCHITECTURE
           ========================================= */
        const Maniaca = {
            state: { user: null, activeStudent: null, students: {} },

            auth: {
                login() {
                    const id = document.getElementById('auth-id').value;
                    const pw = document.getElementById('auth-pw').value;
                    if(id === 'admin' && pw === '1234') {
                        this.success({id:'admin', role:'super_admin', name:'총괄관리자'});
                    } else {
                        onValue(ref(db, 'academies'), snap => {
                            const data = snap.val(); let found = null;
                            if(data) Object.values(data).forEach(a => { if(a.id === id && a.pw === pw) found = a; });
                            if(found) this.success({...found, role:'director'});
                            else alert('로그인 실패');
                        }, {onlyOnce:true});
                    }
                },
                success(user) {
                    Maniaca.state.user = user;
                    localStorage.setItem('m_session', JSON.stringify(user));
                    document.getElementById('auth-layer').classList.add('hidden');
                    document.getElementById('app-container').style.display = 'flex';
                    document.getElementById('user-info').innerText = user.name;
                    Maniaca.students.init();
                },
                logout() { localStorage.clear(); location.reload(); },
                check() { 
                    const s = localStorage.getItem('m_session');
                    if(s) this.success(JSON.parse(s));
                }
            },

            ui: {
                switchPage(id) {
                    document.querySelectorAll('.view-section').forEach(s => s.classList.add('hidden'));
                    document.getElementById(`${id}-page`).classList.remove('hidden');
                    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                },
                openModal(id) { document.getElementById(id).style.display = 'flex'; }
            },

            students: {
                init() {
                    onValue(ref(db, 'students'), snap => {
                        const data = snap.val() || {};
                        Maniaca.state.students = data;
                        const tbody = document.getElementById('student-tbody');
                        tbody.innerHTML = "";
                        Object.entries(data).forEach(([key, s]) => {
                            tbody.innerHTML += `<tr>
                                <td>${s.id}</td>
                                <td style="font-weight:700;">${s.name}</td>
                                <td>${s.school || '-'}</td>
                                <td><span class="badge bg-ok">재원</span></td>
                                <td>
                                    <button class="btn btn-p" onclick="Maniaca.students.goDetail('${key}')">상세/분석</button>
                                    <button class="btn btn-gray" onclick="Maniaca.students.remove('${key}')">삭제</button>
                                </td>
                            </tr>`;
                        });
                    });
                },
                goDetail(id) {
                    Maniaca.state.activeStudent = id;
                    const s = Maniaca.state.students[id];
                    document.getElementById('det-name').innerText = s.name;
                    document.getElementById('det-school').innerText = s.school || '학교 정보 없음';
                    Maniaca.ui.switchPage('detail');
                    this.loadDetail('score'); // 기본은 성적 탭
                },
                loadDetail(type) {
                    // 탭 UI 전환
                    document.querySelectorAll('.profile-tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.detail-sub-section').forEach(s => s.classList.add('hidden'));
                    
                    const btnIdx = type === 'score' ? 0 : 1;
                    document.querySelectorAll('.profile-tab-btn')[btnIdx].classList.add('active');
                    document.getElementById(`det-section-${type}`).classList.remove('hidden');

                    const sid = Maniaca.state.activeStudent;
                    const student = Maniaca.state.students[sid];

                    if(type === 'score') this.renderScores(student.scores);
                    else this.renderAttendance(student.history);
                },
                renderScores(scores) {
                    const container = document.getElementById('score-graph-render');
                    container.innerHTML = "";
                    if(!scores) { container.innerHTML = "<p>등록된 성적이 없습니다.</p>"; return; }
                    Object.values(scores).forEach(s => {
                        const height = (s.score / 100) * 100;
                        container.innerHTML += `
                            <div class="graph-bar-wrapper">
                                <span style="font-weight:800; color:var(--p-color);">${s.score}</span>
                                <div class="graph-bar" style="height:${height}%"></div>
                                <span class="graph-label">${s.name}</span>
                            </div>`;
                    });
                },
                renderAttendance(history) {
                    const tbody = document.getElementById('attend-history-render');
                    tbody.innerHTML = "";
                    if(!history) { tbody.innerHTML = "<tr><td colspan='3'>출결 기록이 없습니다.</td></tr>"; return; }
                    Object.values(history).sort((a,b)=>new Date(b.date)-new Date(a.date)).forEach(h => {
                        const badge = h.att === '등원' ? 'bg-ok' : 'bg-err';
                        tbody.innerHTML += `<tr>
                            <td>${h.date}</td>
                            <td><span class="badge ${badge}">${h.att}</span></td>
                            <td>${h.note || '-'}</td>
                        </tr>`;
                    });
                },
                addScore() {
                    const name = document.getElementById('new-score-name').value;
                    const score = document.getElementById('new-score-val').value;
                    if(!name || !score) return;
                    push(ref(db, `students/${Maniaca.state.activeStudent}/scores`), { name, score: parseInt(score) });
                    document.getElementById('new-score-name').value = "";
                    document.getElementById('new-score-val').value = "";
                }
            }
        };

        window.Maniaca = Maniaca;
        Maniaca.auth.check();
    </script>
</body>
</html>
